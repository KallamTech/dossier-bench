# Ground truth for the benchmark case. Everything in expected/ is derived from
# this file by generate.py. Fictional parties and matter. Bump case_version
# whenever anything that changes the rendered documents changes.
case_version: 7
case:
  name: "Tidewell Fabrication v. Brisamar Logistics"
  type: commercial_dispute
  language: en
  one_line: >-
    Tidewell Fabrication Ltd (UK supplier/installer) claims unpaid milestone
    invoice and wrongful termination against Brisamar Logistics SA (Spanish
    buyer) over a delayed warehouse conveyor installation in Valencia;
    Brisamar counterclaims liquidated damages.

