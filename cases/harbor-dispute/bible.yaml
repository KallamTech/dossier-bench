  - key: tidewell
    name: Tidewell Fabrication Ltd
    aliases: [Tidewell, HFL, the Supplier]
    role: claimant
    country: GB
    address: "Unit 4, Kestrel Quay Industrial Estate, Southampton ZZ1 4BL, United Kingdom"
  - key: brisamar
    name: Brisamar Logistics SA
    aliases: [Brisamar, the Buyer]
    role: respondent
    country: ES
    address: "Polígono Industrial Los Almendros, Calle del Almendro 14, 46988 Paterna (Valencia), Spain"
  - key: velden
    name: Velden Controls BV
    aliases: [Velden]
    role: subcontractor_of_tidewell
    country: NL
  - key: meridian
    name: Meridian Forensic Scheduling Ltd
    aliases: [Meridian]
    role: delay_expert_firm
    country: GB
  - key: calloway
    name: Calloway Price LLP
