  - { key: notice-2, date: 2025-03-09, text: "Tidewell serves second delay notice (power supply not available) and claims 21 days extension of time", docs: [delay-thread, expert-report] }
  - { key: eot-rejected, date: 2025-03-11, text: "Brisamar rejects the extension of time and warns of liquidated damages from 21 March 2025", docs: [delay-thread, expert-report] }
  - { key: suspension, date: 2025-03-14, text: "Installation in Bay 3 suspended pending floor re-levelling", docs: [site-photo, expert-report] }
  - { key: power-energised, date: 2025-03-18, text: "400A power supply energised, 39 days after the contractual date", docs: [expert-report, commissioning-log] }
  - { key: invoice-0417, date: 2025-03-24, text: "Tidewell issues invoice 0417 for milestone 3 (mechanical completion), €257,600, due 23 April 2025", docs: [invoice-es, notes-txt] }
  - { key: co-4, date: 2025-03-28, text: "Change Order CO-4 (additional safety fencing, +€9,500, +3 days) approved", docs: [change-orders] }
  - { key: pc-due, date: 2025-04-25, text: "Re-baselined practical completion date passes without completion", docs: [contract-v2, termination, expert-report] }
  - { key: termination, date: 2025-05-02, text: "Brisamar terminates the agreement for alleged material breach and claims €45,080 liquidated damages", docs: [termination, notes-txt, expert-report] }
  - { key: invoice-hold, date: 2025-04-28, text: "Brisamar places payment of invoice 0417 on hold pending its delay-damages claim and the Bay 3 works", docs: [invoice-hold] }
  - { key: vacate, date: 2025-05-09, text: "Deadline set by Brisamar for Tidewell to vacate the site", docs: [termination] }
  - { key: counsel-call, date: 2025-05-15, text: "Calloway Price call with Daniel Mercer on strategy", docs: [notes-txt] }
  - { key: expert-report, date: 2025-06-30, text: "Meridian delay analysis report issued: 34 days critical delay, 23 attributable to Brisamar, 11 to Tidewell", docs: [expert-report] }

