  - { key: contract-v2, date: 2025-01-20, text: "Amended and Restated Agreement signed; price €1,288,000; milestones re-baselined", docs: [contract-v2, expert-report] }
  - { key: power-due, date: 2025-02-07, text: "Contractual date for Brisamar to provide the 400A power supply (clause 6.4); not met", docs: [contract-v2, delay-thread, expert-report] }
