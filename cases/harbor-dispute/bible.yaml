  - { key: notice-1, date: 2025-02-21, text: "Tidewell serves first delay notice under clause 9.2 (floor slab) and issues CO-3", docs: [delay-thread, change-orders, expert-report] }
  - { key: site-meeting, date: 2025-02-20, text: "Site meeting reviews Levantina's survey results (18 mm over 3 m at C5); Brisamar cites an August 2024 survey showing the slab within tolerance", docs: [acta-reunion] }
