text: |
  Dear Priya,

  I refer to Tidewell's invoice No. 0417 dated 24 March 2025 for €257,600 (Milestone 3, Mechanical Completion), which fell due on 23 April 2025.

  On instruction from Lucía Ortega, Brisamar is placing payment of this invoice on hold pending resolution of the following:

  1. Brisamar's claim for delay damages under clause 10.1 running from the Mechanical Completion date of 21 March 2025;
  2. the outstanding works in Bay 3, zone C4–C7, which Tidewell's notice of 21 March 2025 expressly excluded from Mechanical Completion.

  Please confirm by Friday 2 May 2025 the revised date on which Tidewell will achieve Practical Completion. Our finance department will review the position once the delay claims are resolved.

  Kind regards,
  Marc Pujol
  Site Manager, Brisamar Logistics SA
  Polígono Industrial Fuente del Jarro, Paterna (Valencia)
