# Email thread rendered to 06_delay_notice_thread_{n}.eml. Replies quote the
# previous message so the metadata stage's quote stripping is exercised.
thread_subject: "NWL-VAL-2024-07 — Notice of delay event under clause 9.2 — Bay 3 floor slab"
messages:
  - key: delay-thread-1
    must_facts:
      - "Formal notice under clause 9.2 dated 21 February 2025 from Priya Nair to Lucía Ortega"
      - "Bay 3 slab out of tolerance: 18 mm over 3 m against 5 mm (Levantina survey attached)"
      - "Extension of time claimed: 14 days"
      - "Change Order CO-3 issued for €48,000 and 14 days"
      - "Flags that the 400A supply due 7 February 2025 is not available"
    message_id: "<20250221104512.HFL-0931@tidewellfab.example>"
    date: "Fri, 21 Feb 2025 10:45:12 +0000"
    from: { ref: nair }
    to: [{ ref: ortega }]
    cc: [{ ref: pujol }, { ref: mercer }, { ref: wojcik }]
    attachments: [survey-attachment]
    body: |
      Dear Lucía,

      NOTICE OF DELAY EVENT — CLAUSE 9.2

      I write to give formal notice under clause 9.2 of the Supply and Installation Agreement dated 4 November 2024, as amended and restated on 20 January 2025.

      On Tuesday 18 February 2025, while setting out the sorter supports in Bay 3, Tomasz Wójcik found that the floor slab between grid lines C4 and C7 is visibly out of level. We instructed Levantina Topografía SL to survey the slab the following day. Their report LT-2025-0218 is attached. It records a maximum deviation of 18 mm over 3 m, centred on grid line C5, against the tolerance of 5 mm over 3 m required by clause 6.2 of the Agreement. The deviation exceeds the ±20 mm adjustment range of the sorter supports once the high point at C7 is taken into account.

      Delay Event: failure of the Site to comply with clause 6.2 (clause 9.1(b)).

      Likely effect: the sorter supports in zone C4–C7 cannot be set until the slab has been re-levelled. Our programme shows this activity starting on 24 February 2025 on the critical path. Based on Levantina's estimate of seven days for screed application and curing, plus mobilisation, we currently estimate a delay to Mechanical Completion and Practical Completion of 14 days, subject to the method of re-levelling Brisamar elects.

      Extension of time claimed: 14 days, to be confirmed once the re-levelling method is agreed.

      We have today issued Change Order CO-3 (re-level Bay 3 floor slab) for €48,000 and 14 days, which proposes grinding the high points and a self-levelling screed. Please countersign CO-3 under clause 5.3, or instruct an alternative, as soon as possible. We can continue installation in Bays 1 and 2 and in the remaining zones of Bay 3 in the meantime.

      I should also flag that the permanent 400A supply under clause 6.4 was due on 7 February 2025 and is not yet available. We will keep this under review.

      Kind regards,

      Priya Nair
      Project Manager, Tidewell Fabrication Ltd
      +44 23 8087 1140 | p.nair@tidewellfab.example

  - key: delay-thread-2
    must_facts:
      - "Brisamar (Lucía Ortega) does not accept the slab is out of tolerance, citing the main contractor survey"
      - "Rejects CO-3 and any extension of time"
      - "Instructs Tidewell to proceed at risk"
    message_id: "<20250224161803.NWL-4417@brisamar-logistics.example>"
    date: "Mon, 24 Feb 2025 16:18:03 +0100"
    from: { ref: ortega }
    to: [{ ref: nair }]
    cc: [{ ref: pujol }, { ref: mercer }]
    in_reply_to: delay-thread-1
    body: |
      Dear Priya,

      Thank you for your e-mail of 21 February and the Levantina report.

      Brisamar does not accept that the Bay 3 slab is outside tolerance. The slab was surveyed by the main contractor on completion in August 2024 and found to be within 5 mm over 3 m. We will send that survey to you when we have it from the main contractor. In the meantime we do not accept CO-3 and we do not accept any extension of time on this ground.

      Tidewell's supports are, as you say, adjustable, and Tidewell's tender confirmed that minor deviations could be accommodated. Please proceed with the installation at Tidewell's risk. If Tidewell considers that local grouting is required it should carry this out as part of its installation works.

      Please send your cost and time proposal in any event so that we have it on file, but you should not treat this as an instruction.

      Regarding the power supply, Marc is chasing the utility and will revert.

      Best regards,

      Lucía Ortega
      Project Director, Brisamar Logistics SA

  - key: delay-thread-3
    must_facts:
      - "Second notice under clause 9.2 dated 9 March 2025: permanent 400A supply not available"
      - "Extension of time claimed: 21 days, in addition to the 14 days for the slab"
      - "Tidewell will suspend work on conveyor line 2 in zone C4–C7 unless instructed by 14 March 2025"
    message_id: "<20250309093327.HFL-0958@tidewellfab.example>"
    date: "Sun, 9 Mar 2025 09:33:27 +0000"
    from: { ref: nair }
    to: [{ ref: ortega }]
    cc: [{ ref: pujol }, { ref: mercer }, { ref: wojcik }]
    in_reply_to: delay-thread-2
    body: |
      Dear Lucía,

      SECOND NOTICE OF DELAY EVENT — CLAUSE 9.2 — PERMANENT POWER SUPPLY

      I write to give notice of a further Delay Event under clause 9.2.

      Clause 6.4 of the Amended and Restated Agreement required Brisamar to provide and energise a permanent 400A three-phase supply to the installation hall distribution board not later than 7 February 2025. As of today, 9 March 2025, the supply is not available. The controls cabinets for Bays 1 and 2 are installed and loop checks were programmed to start tomorrow, 10 March 2025. Under clause 8.5 testing and commissioning cannot commence until the permanent supply is energised.

      Delay Event: failure to comply with clause 6.4 (clause 9.1(b)).

      Likely effect: the loop-check, software-load and dry-run sequence cannot start. Every day without the supply from 10 March is a day of critical delay to Practical Completion. Taking Marc's latest indication of the week of 17 March, we estimate 21 days.

      Extension of time claimed: 21 days to Practical Completion, in addition to the 14 days claimed in my notice of 21 February 2025 in respect of the Bay 3 slab.

      On the slab: we have not received the main contractor's survey referred to in your e-mail of 24 February. We maintain that the slab is Brisamar's responsibility under clause 6.2. We have continued installation outside zone C4–C7 as you requested, but we cannot set the supports in that zone, and CO-3 remains unsigned. Unless we receive an instruction by Friday 14 March we will have to suspend work on conveyor line 2 in that zone.

      Kind regards,

      Priya Nair
      Project Manager, Tidewell Fabrication Ltd

  - key: delay-thread-4
    must_facts:
      - "Brisamar rejects the extension of time on 11 March 2025"
      - "States the 400A supply will be energised by the end of the week"
      - "Warns liquidated damages will apply from 21 March 2025 and that suspension would be a breach"
    message_id: "<20250311121940.NWL-4452@brisamar-logistics.example>"
    date: "Tue, 11 Mar 2025 12:19:40 +0100"
    from: { ref: ortega }
    to: [{ ref: nair }]
    cc: [{ ref: pujol }, { ref: mercer }]
    in_reply_to: delay-thread-3
    body: |
      Dear Priya,

      I refer to your e-mail of 9 March.

      Brisamar rejects the extension of time claimed. The utility has confirmed that the switchboard upgrade will be completed and the 400A supply energised by the end of this week. Tidewell is in any event not ready to commission: the sorter is not mechanically complete and, by your own account, work in Bay 3 is incomplete. Any delay to commissioning is the result of Tidewell's late delivery in February and its slow progress in Bay 3, not of the power supply.

      Brisamar reminds Tidewell that Mechanical Completion is due on 21 March 2025 and Practical Completion on 25 April 2025. Brisamar will apply liquidated damages under clause 10 from 21 March 2025 if Mechanical Completion is not achieved, and reserves all its rights.

      Please do not suspend any work. Any suspension will be treated as a breach of the Agreement.

      Regards,

      Lucía Ortega
      Project Director, Brisamar Logistics SA
