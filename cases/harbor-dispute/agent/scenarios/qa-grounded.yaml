- id: qa-ld-rate
  group: qa-grounded
  tags:
  - qa
  - core
  turns:
  - content: What is the liquidated damages rate and cap under the supply agreement?
    expect:
      answer:
        must_facts:
        - 0.5% of the contract price per week of delay
        - capped at 10% of the contract price
        must_not_claim:
        - liquidated damages run from mechanical completion
      citations:
        must_include_docs:
        - contract-v1
        min: 1
- id: qa-price-change
  group: qa-grounded
  tags:
  - qa
  - core
  turns:
