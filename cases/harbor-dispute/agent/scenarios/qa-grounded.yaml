- id: qa-termination-grounds
  group: qa-grounded
  tags:
  - qa
  - core
  turns:
  - content: On what grounds did Brisamar terminate, what did it claim, and by when did Tidewell have to leave the site?
    expect:
      answer:
        must_facts:
        - terminated under clause 12.1 for failure to achieve practical completion by 25 April 2025
        - claimed liquidated damages of €45,080
        - vacate the site by 9 May 2025
      citations:
        must_include_docs:
        - termination
- id: qa-cure-notice
  group: qa-grounded
  tags:
  - qa
  - core
  - reasoning
  turns:
  - content: Did Brisamar follow the contractual termination procedure? Explain with reference to the relevant clause.
    expect:
      answer:
        must_facts:
        - clause 12.1 requires a written notice specifying the breach and a 21-day period to remedy it
        - no cure notice was served before the termination of 2 May 2025
        - the termination was with immediate effect
      citations:
        min: 2
