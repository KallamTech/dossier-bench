  must_facts:
  - Financial due diligence report by Hollis & Marr LLP dated 28 February 2025 for Castellane
  - ARR of £5,900,000 at 31 December 2024; Northgate Retail is the largest customer at £1,300,000 (22%)
  - Northgate's contract expires on 30 June 2025 and renewal is flagged as a key risk; management expects renewal
  - Net cash of £1,200,000 at the locked-box date; normalised EBITDA £1,450,000 for FY2024
  - Recommends a specific indemnity or price adjustment for Northgate churn
