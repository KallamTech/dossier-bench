  title: Share Purchase Agreement — Castellane Holdings Ltd and the Sellers of Brightwater Analytics Ltd (executed 14 March
    2025)
  date: 2025-03-14
  date_tolerance: exact
  types:
  - contract
  - agreement
  - share purchase agreement
  language: en
  page_count: 10
  must_phrases:
  - 14 March 2025
  - 18,500,000
  - Escrow Account
  - Schedule 4
  must_facts:
  - Executed share purchase agreement dated 14 March 2025 between Castellane Holdings Ltd and Imogen Hale and Rafael Duarte
    as sellers
  - Price £18,500,000 on a locked-box basis at 31 December 2024; £16,650,000 payable at completion and £1,850,000 into escrow
    for 18 months
  - Completion on 30 April 2025
  - 'Warranty claims: notice within 18 months of completion, cap 25% of the price (£4,625,000), de minimis £25,000, basket
    £185,000'
  - 'Warranty 12.3: no material customer (over 5% of ARR) has given notice to terminate or not renew'
  - 'Warranty 15.1: no litigation or employment claims pending or threatened'
  - 'Warranty 18.4: no copyleft open-source software is incorporated in the products in a way that requires disclosure of
    source code'
  - 'Earn-out (schedule 7): up to £3,000,000 if ARR at 31 December 2025 is at least £6,200,000, pro rata above £5,500,000;
    ARR means contracted recurring revenue from live customers'
  - Governed by the law of England and Wales
  family:
    group: spa
    role: revision
  sha256: 372fdd3e159665c3abaf86857b0c59a37814b2eb0f35f680d09b7ca0ca99bebb
