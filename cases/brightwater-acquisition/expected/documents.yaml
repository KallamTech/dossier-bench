  must_facts:
  - Draft 7 of the share purchase agreement, circulated by Fenwick Rowe on 7 March 2025
  - Purchase price £18,500,000 on a locked-box basis as at 31 December 2024
  - Escrow of £1,850,000 for 18 months (bracketed as 12 months in this draft)
  - Warranty claims capped at 25% of the price, de minimis £25,000, basket £185,000
