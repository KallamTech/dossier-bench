    name: Castellane Holdings Ltd
    aliases: [Castellane, the Buyer]
    role: buyer
    country: GB
    address: "14 Ashgrove Mews, London ZZ3 6LX, United Kingdom"
  - key: brightwater
    name: Brightwater Analytics Ltd
    aliases: [Brightwater, the Company, the Target]
