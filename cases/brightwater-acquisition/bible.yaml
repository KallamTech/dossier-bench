# Ground truth for the second benchmark case: a UK share purchase with a post-completion warranty
# claim and an earn-out dispute. Fictional parties. Everything in expected/ is derived from this
# file by generate.py. Bump case_version whenever anything that changes the rendered documents changes.
case_version: 5
case:
  name: "Castellane Holdings — acquisition of Brightwater Analytics"
  type: corporate_ma
  language: en
  one_line: >-
    Castellane Holdings Ltd bought Brightwater Analytics Ltd from its founders under an SPA
    signed 14 March 2025 and completed 30 April 2025. Castellane now claims breach of the
    customer, litigation and IP warranties (the Northgate non-renewal, the Okafor tribunal
    claim, AGPL components) and the parties dispute the ARR earn-out.

