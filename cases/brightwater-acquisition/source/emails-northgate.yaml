text: |
  Dear Imogen,

  Further to our review of analytics suppliers, I am writing to give formal notice under clause 3.2 of the Master Services Agreement dated 1 July 2022 (as renewed on 1 July 2024) that Northgate Retail plc will not renew the agreement on its expiry on 30 June 2025.

  The decision reflects our programme to consolidate reporting and analytics into our ERP vendor's module from July 2025. It is not a reflection on the Brightwater service, which has performed well.

  We would be open to a short transition arrangement on a reduced fee, covering historical data access and export support, through to December 2025. Please let me know if you would like to discuss.

  Kind regards,
  Gareth Whitcombe
  Head of Procurement, Northgate Retail plc
