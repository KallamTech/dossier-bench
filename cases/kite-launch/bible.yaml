# Ground truth for the business benchmark case: a B2B software launch run by a small team.
# No legal content; the vocabulary is project / team / counterparty. Everything in expected/
# is derived from this file by generate.py. Bump case_version whenever rendered documents change.
case_version: 4
case:
  name: "Project Kite — Kite Planner 3.0 launch"
  type: project
  language: en
  one_line: >-
    Larkspur Labs is launching Kite Planner 3.0. Kickoff 8 July 2025, launch planned for
    15 October 2025, slipped to 29 October after a single sign-on bug in beta; a launch video
    vendor quote was negotiated down; the press release went through two versions.

