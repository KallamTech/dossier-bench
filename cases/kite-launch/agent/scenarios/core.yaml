- id: route-timeline
  group: timeline
  tags:
  - timeline
  turns:
  - content: Give me a dated timeline of the project from kickoff to the go / no-go.
    expect:
      answer:
        must_facts:
        - 8 July 2025 kickoff
        - 24 July quote and 5 August agreement with Pixelforge
        - 14 August design review
        - 1 September beta start
        - 12 September SSO bug and 18 September slip to 29 October
        - 26 September press release v2 and 3 October video delivery
        - 22 October go / no-go
