- id: qa-launch-date
  group: qa-grounded
  tags:
  - qa
  - core
  turns:
  - content: When is the launch, and why did the date change?
    expect:
      answer:
        must_facts:
        - 29 October 2025
        - moved from 15 October on 18 September 2025
        - because of the single sign-on bug for users with more than one role, reported by Holloway Logistics on 12 September
      citations:
        must_include_docs:
        - status-update
- id: qa-video-deal
  group: qa-grounded
  tags:
  - qa
  - core
  turns:
  - content: What did Pixelforge originally quote for the launch video, what was agreed, and what changed in scope?
    expect:
      answer:
        must_facts:
        - £24,500 in quote Q-2025-118
        - agreed at £21,000
        - one concept instead of two and no vertical social version
        - delivery by 3 October 2025
      citations:
        must_include_docs:
        - vendor-quote
        - vendor-thread-2
        min: 2
- id: qa-beta-nps
  group: qa-grounded
  tags:
  - qa
  - core
  turns:
  - content: What was the beta NPS, how many promoters and detractors, and who were the detractors?
    expect:
      answer:
        must_facts:
        - NPS 41
        - 7 promoters and 2 detractors out of 12
        - Holloway Logistics (6) and Dunmore Council (5)
      citations:
        must_include_docs:
        - beta-survey
- id: qa-budget-status
  group: qa-grounded
  tags:
  - qa
  - core
  - csv
  turns:
  - content: How much of the launch budget has been spent, and which line is furthest below plan?
    expect:
      answer:
        must_facts:
        - £70,300 spent of £120,000
        - 'paid media is furthest below plan: £18,500 against £40,000, because spend starts on 20 October'
      citations:
        must_include_docs:
        - budget
- id: qa-open-items
  group: qa-grounded
  tags:
  - qa
  - core
  turns:
  - content: Which checklist items are still open before the go / no-go, and who owns them?
    expect:
      answer:
        must_facts:
        - SSO multi-role fix sign-off, Owen Castillo, due 17 October 2025
        - pricing page, Ines Okonkwo, due 20 October 2025
        - go / no-go on 22 October 2025
      citations:
        must_include_docs:
        - checklist
- id: qa-design-decisions
  group: qa-grounded
  tags:
  - qa
  - ocr
  turns:
  - content: What was decided at the dashboard design review?
    expect:
      answer:
        must_facts:
        - approved with changes
        - the filter bar moves to the top
        - saved views get a rename action and a set-as-default toggle
        - dark mode parked for 3.1
      citations:
        must_include_docs:
        - design-review
- id: qa-sso-bug
  group: qa-grounded
  tags:
  - qa
  turns:
  - content: What exactly did Holloway report about single sign-on, and how many of their users are affected?
    expect:
      answer:
        must_facts:
        - users with more than one role cannot sign in through SSO and get 'role mapping failed'
        - 14 of 60 users, including all planners
        - single-role users sign in fine
      citations:
        must_include_docs:
        - customer-email
- id: followup-video-math
  group: followup
  tags:
  - followup
  - math
  turns:
  - content: What deposit did Larkspur pay Pixelforge?
    expect:
      answer:
        must_facts:
        - £10,500, 50% of £21,000
  - content: And how much is left to pay on delivery, and against which budget line?
    expect:
      answer:
        must_facts:
        - £10,500
        - the launch video line, planned £25,000
  - content: So how far under plan is that line?
    expect:
      answer:
        must_facts:
        - £4,000 under plan (£21,000 against £25,000)
